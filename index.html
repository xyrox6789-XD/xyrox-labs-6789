<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XYROX | OS</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Official Google Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    /* ================= DYNAMIC LIGHT/DARK THEME ENGINE ================= */
    :root {
      /* Light Mode Colors */
      --xy-bg: #f8fafc;
      --xy-text: #0f172a;
      --xy-text-muted: #64748b;
      --xy-panel: rgba(255, 255, 255, 0.8);
      --xy-panel-solid: #ffffff;
      --xy-border: rgba(0, 0, 0, 0.08);
      --xy-accent: #0284c7;
      --xy-accent-glow: rgba(2, 132, 199, 0.2);
    }
    
    .dark {
      /* Dark Mode Colors (Vercel/Linear aesthetic) */
      --xy-bg: #000000;
      --xy-text: #ffffff;
      --xy-text-muted: #94a3b8;
      --xy-panel: rgba(15, 15, 15, 0.65);
      --xy-panel-solid: #0a0a0a;
      --xy-border: rgba(255, 255, 255, 0.1);
      --xy-accent: #38bdf8;
      --xy-accent-glow: rgba(56, 189, 248, 0.15);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100dvh;
      background-color: var(--xy-bg); color: var(--xy-text);
      font-family: 'Inter', sans-serif; overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* --- PREMIUM BACKGROUND (No Orbs, Just Clean Mesh) --- */
    .premium-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: 
        radial-gradient(circle at top right, var(--xy-accent-glow), transparent 40%),
        radial-gradient(circle at bottom left, var(--xy-accent-glow), transparent 40%);
      transition: all 0.5s ease;
    }
    .grid-overlay {
      position: absolute; inset: 0; opacity: 0.4;
      background-image: 
        linear-gradient(var(--xy-border) 1px, transparent 1px),
        linear-gradient(90deg, var(--xy-border) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
    }

    /* --- UI ELEMENTS --- */
    .xy-sidebar { background: var(--xy-panel-solid); border-right: 1px solid var(--xy-border); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .xy-header { background: var(--xy-panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--xy-border); }
    
    /* Scrollbar */
    .scroll-area { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--xy-border); border-radius: 10px; }

    /* Animated Brand Text */
    .brand-text {
      background: linear-gradient(90deg, var(--xy-text) 0%, var(--xy-text-muted) 50%, var(--xy-text) 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 3s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    /* Nav Links */
    .nav-link { transition: all 0.2s ease; color: var(--xy-text-muted); }
    .nav-link.active { background: var(--xy-accent-glow); border-left: 3px solid var(--xy-accent); color: var(--xy-text); }
    .nav-link:hover:not(.active) { background: var(--xy-border); color: var(--xy-text); }

    /* Toast Notification */
    #toast {
      position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
      background: var(--xy-text); color: var(--xy-bg);
      padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 500;
      transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    #toast.show { bottom: 32px; }
  </style>
</head>
<body class="flex h-screen w-screen overflow-hidden antialiased">

  <!-- PREMIUM BACKGROUND -->
  <div class="premium-bg">
    <div class="grid-overlay"></div>
  </div>

  <!-- ================= LEFT SIDEBAR (Toggleable) ================= -->
  <aside id="sidebar" class="xy-sidebar w-64 h-full flex flex-col z-40 absolute md:relative transform -translate-x-full md:translate-x-0 shadow-2xl">
    
    <!-- Sidebar Header (Matches Top Bar Height) -->
    <div class="h-16 flex items-center gap-3 px-6 border-b border-[var(--xy-border)]">
      <div class="w-8 h-8 rounded-lg bg-[var(--xy-accent)] text-white flex items-center justify-center font-bold text-sm shadow-lg">
        X
      </div>
      <div>
        <h1 class="font-bold tracking-widest text-xs uppercase leading-none brand-text">XYROX OS</h1>
      </div>
    </div>

    <nav class="flex-1 scroll-area p-3 space-y-6">
      <!-- MAIN GROUP -->
      <div>
        <div class="px-4 text-[10px] font-mono uppercase tracking-widest text-[var(--xy-text-muted)] mb-2 flex items-center gap-2">
          MAIN
        </div>
        <div class="space-y-0.5">
          <a href="#" class="nav-link active flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg> Home
          </a>
          <a href="#" class="nav-link flex items-center justify-between px-4 py-2.5 rounded-lg text-sm font-medium">
            <div class="flex items-center gap-3"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg> Tasks</div>
            <span class="text-[10px] bg-[var(--xy-border)] px-1.5 py-0.5 rounded font-mono">0</span>
          </a>
          <a href="#" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Focus
          </a>
          <a href="#" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg> Calendar
          </a>
          <a href="#" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> AI Assistant
          </a>
        </div>
      </div>
    </nav>
  </aside>

  <!-- Mobile Overlay for Sidebar -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 hidden transition-opacity md:hidden"></div>

  <!-- ================= RIGHT CONTENT AREA ================= -->
  <div class="flex-1 flex flex-col relative z-10 min-w-0">
    
    <!-- TOP HEADER -->
    <header class="xy-header h-16 px-4 md:px-6 flex items-center justify-between shrink-0">
      
      <!-- Left: 3-Line Menu & Brand -->
      <div class="flex items-center gap-4">
        <button id="menuBtn" class="p-2 rounded-md hover:bg-[var(--xy-border)] transition text-[var(--xy-text)]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h2 class="text-xl font-bold tracking-tight brand-text hidden sm:block">XYROX</h2>
      </div>

      <!-- Right: Actions, Theme, Auth -->
      <div class="flex items-center gap-3 shrink-0">
        
        <!-- Theme Toggle (Light/Dark) -->
        <button id="themeToggleBtn" class="p-2 rounded-full hover:bg-[var(--xy-border)] transition text-[var(--xy-text-muted)] hover:text-[var(--xy-text)]" title="Toggle Theme">
          <!-- Sun Icon (shows in dark mode) -->
          <svg id="sunIcon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <!-- Moon Icon (shows in light mode) -->
          <svg id="moonIcon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>

        <!-- New Task Button -->
        <button onclick="triggerNewTask()" class="hidden sm:flex items-center gap-2 bg-[var(--xy-text)] text-[var(--xy-bg)] px-4 py-2 rounded-full text-sm font-semibold hover:opacity-90 transition shadow-lg">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> New task
        </button>

        <!-- AUTH SLOT -->
        <div id="auth-slot" class="h-9 border border-[var(--xy-border)] rounded-full bg-[var(--xy-border)] flex items-center px-3 gap-2 transition hover:bg-[var(--xy-panel)]">
          <span class="text-xs text-[var(--xy-text-muted)]">Loading...</span>
        </div>
      </div>
    </header>

    <!-- MAIN SCROLLABLE CONTENT (SKELETON ONLY) -->
    <main class="flex-1 scroll-area p-6 lg:p-10">
      <div class="w-full h-full border-2 border-dashed border-[var(--xy-border)] rounded-3xl flex flex-col items-center justify-center text-center p-8 bg-[var(--xy-panel)] backdrop-blur-md">
        
        <div class="w-16 h-16 bg-[var(--xy-accent-glow)] rounded-2xl flex items-center justify-center mb-6">
          <svg class="w-8 h-8 text-[var(--xy-accent)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
        </div>
        
        <h3 class="text-2xl font-semibold mb-2">Skeleton Mode Active</h3>
        <p class="text-sm text-[var(--xy-text-muted)] max-w-md">
          UI rebuilt. Try the 3-line menu, the light/dark mode switch, and the "New task" button at the top!
        </p>
      </div>
    </main>
  </div>

  <!-- Toast Notification System -->
  <div id="toast">✅ New Task modal will open here!</div>

  <!-- ================= JAVASCRIPT ENGINE ================= -->
  <script>
    /* 1. SIDEBAR TOGGLE LOGIC */
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    let isSidebarOpen = window.innerWidth >= 768; // Open by default on desktop

    function toggleSidebar() {
      isSidebarOpen = !isSidebarOpen;
      if (isSidebarOpen) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }
    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);
    
    // Auto-close overlay on resize to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.add('hidden');
        isSidebarOpen = true;
      } else {
        if(!overlay.classList.contains('hidden')) {
           // Mobile open state, leave as is
        } else {
           sidebar.classList.add('-translate-x-full');
           isSidebarOpen = false;
        }
      }
    });

    /* 2. THEME TOGGLE LOGIC */
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const htmlEl = document.documentElement;

    themeToggleBtn.addEventListener('click', () => {
      htmlEl.classList.toggle('dark');
      // The icons swap automatically via Tailwind classes (dark:block / dark:hidden)
    });

    /* 3. NEW TASK TOAST LOGIC */
    function triggerNewTask() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    /* 4. IPAD SCROLL FIX */
    document.body.addEventListener('touchmove', function(e) {
      if (!e.target.closest('.scroll-area')) e.preventDefault();
    }, { passive: false });

    /* 5. REAL GOOGLE AUTH ENGINE (WITH ERROR CATCHING) */
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyAKi1ckZIFVxWHy51UBUW5juwjbxNrlcd8",
      authDomain: "xyrox6789-17138.firebaseapp.com",
      projectId: "xyrox6789-17138"
    };

    function initRealGoogleAuth() {
      try {
        if (!firebase.apps.length) firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
        firebase.auth().onAuthStateChanged((user) => {
          const authSlot = document.getElementById("auth-slot");
          if (!authSlot) return;

          if (user) {
            const realName = user.displayName || (user.email ? user.email.split("@")[0] : "Member");
            const avatarHtml = user.photoURL
              ? `<img src="${user.photoURL}" class="w-5 h-5 rounded-full object-cover" />`
              : `<div class="w-5 h-5 rounded-full bg-[var(--xy-accent)] text-white font-bold text-[10px] flex items-center justify-center">${realName.charAt(0).toUpperCase()}</div>`;
            
            authSlot.innerHTML = `
              <div class="flex items-center gap-2 cursor-pointer">
                ${avatarHtml}
                <span class="text-xs font-semibold truncate max-w-[100px]">@${realName.toLowerCase().replace(/\s+/g, '')}</span>
              </div>
            `;
          } else {
            authSlot.innerHTML = `
              <button onclick="signInWithRealGoogle()" class="flex items-center gap-2 text-xs font-semibold hover:opacity-70 transition w-full h-full">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign In
              </button>
            `;
          }
        });
      } catch (err) { console.error("Firebase Auth Error:", err); }
    }

    function signInWithRealGoogle() {
      if (!firebase.apps.length) firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
      const auth = firebase.auth();
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      
      auth.signInWithPopup(provider).catch((error) => {
        console.error(error);
        // Direct alert to tell you exactly what went wrong if Google blocks it!
        alert("Sign In Blocked by Google: " + error.message);
      });
    }

    document.addEventListener("DOMContentLoaded", initRealGoogleAuth);
  </script>
</body>
</html>
