      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Advanced Direct-Input Focus Timer -->

          <!-- Direct Input Fields -->

  <script src="auth.js"></script>

  <!-- Dashboard Logic (Clock & Timer) -->
  <script>
    // --- 1. Live Clock & Dynamic Greeting ---
    function updateDashboardClock() {
      const now = new Date();
      document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }).toUpperCase();
      
      const hr = now.getHours();
      let greeting = 'Good evening.';
      if (hr < 12) greeting = 'Good morning.';
      else if (hr < 17) greeting = 'Good afternoon.';
      document.getElementById('greetingText').textContent = greeting;
    }
    setInterval(updateDashboardClock, 1000);
    updateDashboardClock();

    // --- 2. Direct Input Focus Timer ---
    let timerInt;
    let isTimerRunning = false;
    const minEl = document.getElementById('focusMin');
    const secEl = document.getElementById('focusSec');
    const btnStart = document.getElementById('btnStartFocus');
    const btnReset = document.getElementById('btnResetFocus');

    // Format numbers when user clicks away
    function parseTimerValues() {
      let m = parseInt(minEl.value) || 0;
      let s = parseInt(secEl.value) || 0;
      if (m < 0) m = 0;
      if (s < 0) s = 0;
      if (s > 59) s = 59;
      minEl.value = m.toString().padStart(2, '0');
      secEl.value = s.toString().padStart(2, '0');
      return (m * 60) + s;
    }

    minEl.addEventListener('blur', parseTimerValues);
    secEl.addEventListener('blur', parseTimerValues);

    // Timer Logic
    btnStart.addEventListener('click', () => {
      if(isTimerRunning) {
        clearInterval(timerInt);
        isTimerRunning = false;
        btnStart.textContent = "Resume Session";
        btnStart.className = "flex-1 py-3 bg-white text-black text-sm font-semibold rounded-xl hover:bg-gray-200 transition shadow-lg";
        minEl.disabled = false; secEl.disabled = false;
        minEl.classList.remove('opacity-50'); secEl.classList.remove('opacity-50');
      } else {
        let totalSecs = parseTimerValues();
        if(totalSecs <= 0) return;
        
        isTimerRunning = true;
        btnStart.textContent = "Pause";
        btnStart.className = "flex-1 py-3 bg-white/10 text-white text-sm font-semibold rounded-xl hover:bg-white/20 border border-white/10 transition";
        
        minEl.disabled = true; secEl.disabled = true;
        minEl.classList.add('opacity-50'); secEl.classList.add('opacity-50');
        
        timerInt = setInterval(() => {
          totalSecs--;
          minEl.value = Math.floor(totalSecs / 60).toString().padStart(2, '0');
          secEl.value = (totalSecs % 60).toString().padStart(2, '0');
          
          if(totalSecs <= 0) {
            clearInterval(timerInt);
            isTimerRunning = false;
            btnStart.textContent = "Start Session";
            btnStart.className = "flex-1 py-3 bg-white text-black text-sm font-semibold rounded-xl hover:bg-gray-200 transition shadow-lg";
            minEl.disabled = false; secEl.disabled = false;
            minEl.classList.remove('opacity-50'); secEl.classList.remove('opacity-50');
          }
        }, 1000);
      }
    });

    btnReset.addEventListener('click', () => {
      clearInterval(timerInt);
      isTimerRunning = false;
      btnStart.textContent = "Start Session";
      btnStart.className = "flex-1 py-3 bg-white text-black text-sm font-semibold rounded-xl hover:bg-gray-200 transition shadow-lg";
      minEl.value = "25"; secEl.value = "00";
      minEl.disabled = false; secEl.disabled = false;
      minEl.classList.remove('opacity-50'); secEl.classList.remove('opacity-50');
    });
  </script>
