<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XYROX — Account</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Official Google Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <link rel="stylesheet" href="style.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: { 
            xyrox: { bg: '#060608', panel: 'rgba(17, 17, 21, 0.78)', border: 'rgba(255, 255, 255, 0.09)' } 
          }
        }
      }
    };
  </script>
</head>
<body class="h-screen w-screen bg-[#060608] text-gray-200 flex flex-col md:flex-row antialiased selection:bg-white/20 overflow-hidden">

  <!-- 1. 3D BACKGROUND CONTAINER -->
  <div id="webgl-container" class="fixed inset-0 z-0 pointer-events-none"></div>

  <!-- 1.5 MOBILE HEADER (3-Line Button on LEFT + Clean XYROX Brand) -->
  <div class="md:hidden flex items-center justify-between px-4 py-3.5 bg-xyrox-panel border-b border-xyrox-border z-30 relative">
    <div class="flex items-center gap-3">
      <button id="mobileMenuBtn" class="text-white p-2 bg-white/5 hover:bg-white/10 rounded-xl border border-white/10 transition" aria-label="Open Channels">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-md bg-white text-black flex items-center justify-center font-bold text-xs tracking-tighter">▲</div>
        <span class="font-semibold tracking-tight text-sm text-white">XYROX</span>
      </div>
    </div>
    <!-- Right side left open for the floating Sign-In pill -->
    <div class="w-20"></div>
  </div>

  <!-- Mobile Backdrop Overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity"></div>

  <!-- 2. LEFT SIDEBAR NAVIGATION -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between shrink-0 bg-xyrox-panel backdrop-blur-2xl border-r border-xyrox-border shadow-2xl h-full">
    <div>
      <!-- Clean Vercel/Linear Style Brand Header -->
      <div class="h-16 items-center px-6 border-b border-xyrox-border hidden md:flex gap-3">
        <div class="w-7 h-7 rounded-lg bg-white text-black flex items-center justify-center font-bold text-xs shadow">▲</div>
        <div class="flex items-baseline gap-1.5">
          <span class="font-semibold tracking-tight text-sm text-white">XYROX</span>
          <span class="text-[10px] font-mono text-gray-500 uppercase">OS</span>
        </div>
      </div>
      
      <nav class="p-4 space-y-1.5">
        <a href="index.html" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all text-gray-400 hover:text-white hover:bg-white/5">
          <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          Command
        </a>
        <a href="audio.html" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all text-gray-400 hover:text-white hover:bg-white/5">
          <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
          Audio Studio
        </a>
        <a href="calculator.html" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all text-gray-400 hover:text-white hover:bg-white/5">
          <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
          Calculator
        </a>
        <a href="chat.html" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all text-gray-400 hover:text-white hover:bg-white/5">
          <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
          Global Chat
        </a>
        <a href="ai.html" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all text-gray-400 hover:text-white hover:bg-white/5">
          <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          Xyrox AI
        </a>
      </nav>
    </div>

    <!-- Bottom Account Button -->
    <div class="p-4 border-t border-xyrox-border">
      <a href="settings.html" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm transition-all bg-white/10 text-white border border-white/15">
        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center border border-white/10">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        <div class="flex flex-col items-start leading-tight overflow-hidden">
          <span class="text-gray-100 font-medium text-xs truncate" id="sidebarAuthName">Guest Mode</span>
          <span class="text-[10px] text-gray-400 mt-0.5 truncate" id="sidebarAuthStatus">Tap to Sign In</span>
        </div>
      </a>
    </div>
  </aside>

  <!-- 3. COMPACT CENTERED ACCOUNT VIEW (NO SCROLLING NEEDED) -->
  <main class="flex-1 h-full overflow-y-auto relative z-10 p-5 md:p-10 flex items-center justify-center animate-fade-in">
    <div class="w-full max-w-md">

      <div class="bg-xyrox-panel backdrop-blur-2xl border border-xyrox-border rounded-3xl p-7 md:p-8 shadow-2xl text-center">
        
        <!-- VIEW A: LOGGED OUT -->
        <div id="loggedOutView" class="space-y-6">
          <div class="w-14 h-14 bg-white/5 border border-white/10 rounded-2xl mx-auto flex items-center justify-center">
            <svg class="w-7 h-7" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          </div>

          <div>
            <h2 class="text-xl font-semibold text-white">Sign in to XYROX</h2>
            <p class="text-xs text-gray-400 mt-1">Each user signs in with their own Google Account.</p>
          </div>
          
          <button id="btnGoogleSignIn" class="w-full flex items-center justify-center gap-3 py-3.5 px-6 bg-white text-black text-sm font-semibold rounded-xl hover:bg-gray-200 transition shadow-lg">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
          </button>
        </div>

        <!-- VIEW B: LOGGED IN (UID Removed, Clean Profile) -->
        <div id="loggedInView" class="space-y-5 hidden">
          <div class="relative w-16 h-16 mx-auto">
            <img id="profileAvatarImg" src="" alt="Avatar" class="w-16 h-16 rounded-full object-cover border border-white/20 shadow-lg hidden" />
            <div id="profileAvatarFallback" class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center text-xl font-bold text-white border border-white/20">U</div>
          </div>
          
          <div>
            <h3 id="profileName" class="text-xl font-semibold text-white flex items-center justify-center gap-2">User</h3>
            <p id="profileEmail" class="text-xs text-gray-400 font-mono mt-0.5">user@gmail.com</p>
          </div>

          <!-- Optional Custom Nickname (Saved only for this specific user) -->
          <div class="p-3.5 bg-black/40 border border-white/10 rounded-2xl text-left space-y-2">
            <label class="text-[11px] font-mono uppercase tracking-wider text-gray-400">Display Nickname</label>
            <div class="flex gap-2">
              <input type="text" id="customUsernameInput" placeholder="Your display name..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white/30" />
              <button id="btnSaveUsername" class="px-3.5 py-2 bg-white text-black text-xs font-semibold rounded-xl hover:bg-gray-200 transition">Save</button>
            </div>
          </div>
          
          <button id="btnSignOut" class="w-full py-3 border border-white/15 text-white text-xs font-semibold rounded-xl hover:bg-white/10 transition">
            Sign Out / Switch Google Account
          </button>
        </div>

      </div>

    </div>
  </main>

  <script src="app.js"></script>
  <script src="auth.js"></script>

  <script>
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', () => {
        sidebar.classList.remove('-translate-x-full');
        sidebarOverlay.classList.remove('hidden');
      });
    }
    if (sidebarOverlay) {
      sidebarOverlay.addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnGoogleSignIn').addEventListener('click', signInWithRealGoogle);
      document.getElementById('btnSignOut').addEventListener('click', signOutFromGoogle);

      document.getElementById('btnSaveUsername').addEventListener('click', () => {
        const newName = document.getElementById('customUsernameInput').value.trim();
        if (!newName || !currentGoogleUser) return;
        localStorage.setItem(`xyrox_custom_name_${currentGoogleUser.uid}`, newName);
        currentGoogleUser.displayName = newName;
        updateGlobalAuthUI(currentGoogleUser);
      });
    });
  </script>
</body>
</html>
